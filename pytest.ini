[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=src
    --cov=app
    --cov-branch
    --cov-report=term-missing
    --cov-fail-under=100
markers =
    integration: tests that access external services and may download files
