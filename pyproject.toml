[project]
name = "youtube-video-downloader"
version = "0.1.0"
description = "A tested CLI for downloading YouTube videos with yt-dlp"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "curl-cffi>=0.14.0",
    "flask>=3.1.2",
    "waitress>=3.0.2",
    "yt-dlp[default]>=2026.8.19",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
]
